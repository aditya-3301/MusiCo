<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <!-- Disable user zoom on mobile — the UI is fixed-layout and zoom breaks the player bar. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <!-- iOS home-screen / PWA chrome settings -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#0b0f19">
    <title>MusiCo - by Aditya</title>
    <link rel="stylesheet" href="style.css">
    <!-- GSAP core + Draggable plugin — used for the elastic snap-back on the controls pill. -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/Draggable.min.js"></script>
</head>
<body>
    <!-- particles.js renders its canvas into this div. z-index keeps it behind everything. -->
    <div id="particles-js"></div>

    <button id="hamburger-btn" onclick="toggle_sidebar()" aria-label="Toggle playlist sidebar">
        <span></span><span></span><span></span>
    </button>

    <!-- Darkens the rest of the screen when the sidebar is open on mobile. -->
    <div id="sidebar-overlay" onclick="close_sidebar()"></div>

    <button id="auth-btn" onclick="enter_credentials()">🔒 Enter password to stream</button>
    
    <div class="player-bar">
        
        <div class="custom-controls">
            <button id="shuffle-btn" class="glass-tint-muted" onclick="toggle_shuffle()">🔀</button>
            <button id="prev-btn">⏮</button>
            <button id="play-btn" class="glass-tint-black" onclick="toggle_play()">▶</button>
            <button id="next-btn" class="glass-tint-muted">⏭</button>
            <button id="loop-btn" class="glass-tint-muted" onclick="toggle_loop()">🔁</button>
        </div>
        
        <div class="progress-container">
            <span id="current-time">0:00</span>
            <div class="progress-wrapper">
                <!-- buffer-bar sits behind the range thumb and shows how much is cached. -->
                <div id="buffer-bar"></div>
                <input type="range" id="progress-bar" value="0" max="100">
            </div>
            <span id="total-time">0:00</span>
        </div>

        <div id="now-playing">
            <div id="np-title">Waiting for login...</div>
            <div id="np-artist"></div>
        </div>
        <!-- playsinline stops iOS from going full-screen when playback starts. -->
        <audio id="audio-player" playsinline></audio>
    </div>

    <!-- Mobile-only: persistent search + folder tabs replacing the sidebar drawer.
         Hidden on desktop via CSS; the sidebar handles that role there.          -->
    <div id="mobile-top-bar">
        <div id="mobile-top-row">
            <input type="text" id="mobile-search-box" placeholder="🔍 Search songs..." oninput="filter_songs()">
        </div>
        <div id="mobile-folder-tabs"></div>
    </div>

    <div class="layout">
        <nav class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <h2>Welcome, Aditya</h2>
                <button id="sidebar-close-btn" onclick="close_sidebar()" aria-label="Close sidebar">✕</button>
            </div>
            <input type="text" id="search-box" placeholder="Search" onkeyup="filter_songs()">
            
            <div id="playlist-wrapper">
                <h3 style="margin: 10px 0 10px 10px; font-size: 12px; color: #9ca3af; text-transform: uppercase; letter-spacing: 1px;">Playlists</h3>
                <div id="playlist-container">
                    <div style="padding: 10px; font-size: 13px; color: #9ca3af;">Loading folders...</div>
                </div>
            </div>
        </nav>
        <main class="content">
            <h1 id="folder-title">Loading...</h1>
            <div id="track-list">loading tracks...</div>
        </main>
    </div>
    
    <script>

        // Credentials are stored in memory only — never written to localStorage or the DOM.
        let stream_user = "";
        let stream_pass = "";
        let current_playlist = [];

        function enter_credentials() {
            stream_user = prompt("username:");
            stream_pass = prompt("password:");
            if (stream_user && stream_pass) {
                document.getElementById('auth-btn').innerText = "🔓 Ready to stream";
                document.getElementById('auth-btn').style.color = "#1db954";
                document.getElementById('auth-btn').style.borderColor = "#1db954";
            }
        }

        let current_track_index = -1;
        let is_shuffle = false; 
        let current_folder = 'main';
        let play_next_queue = [];   // tracks queued with the ⏭ "play next" button

        // ghost_player silently preloads the upcoming track while the current one plays.
        // HANDOFF STRATEGY: instead of copying ghost_player.src to the main player (which
        // would throw away the buffered data and start a fresh download), we swap the two
        // Audio objects so the ghost — already buffered — becomes the main player.
        let ghost_player = new Audio();
        ghost_player.preload = 'auto';
        let has_preloaded_next = false;
        let preloaded_index = -1; // which playlist index ghost has loaded

        // play_history keeps track of every index we've visited so that ⏮ always goes
        // back to the real previous song, even in shuffle mode.
        let play_history = [];

        // ── SIDEBAR MOBILE TOGGLE ──────────────────────────────────────────

        function toggle_sidebar() {
            const sidebar = document.getElementById('sidebar');
            const overlay = document.getElementById('sidebar-overlay');
            sidebar.classList.toggle('open');
            overlay.classList.toggle('visible');
        }

        function close_sidebar() {
            const sidebar = document.getElementById('sidebar');
            const overlay = document.getElementById('sidebar-overlay');
            sidebar.classList.remove('open');
            overlay.classList.remove('visible');
        }

        // ── FOLDERS ──────────────────────────────────────────────────────

        async function fetch_folders() {
            const container   = document.getElementById('playlist-container');
            const mobile_tabs = document.getElementById('mobile-folder-tabs');
            if (container)   container.innerHTML = '<div style="padding: 10px; font-size: 13px; color: #9ca3af;">Loading folders...</div>';
            if (mobile_tabs) mobile_tabs.innerHTML = '';

            try {
                const res = await fetch(`/api/folders`);
                if (!res.ok) throw new Error("Failed to fetch folders");
                const folders = await res.json();
                if (container) container.innerHTML = '';

                folders.forEach(folderName => {
                    // ── Desktop sidebar item ──────────────────────────────
                    if (container) {
                        const div = document.createElement('div');
                        div.className = 'folder-item';
                        if (folderName === current_folder) div.classList.add('active');
                        div.innerText = folderName;
                        div.onclick = () => {
                            current_folder = folderName;
                            // Mark this folder active, clear others.
                            container.querySelectorAll('.folder-item').forEach(el => el.classList.remove('active'));
                            div.classList.add('active');
                            // Sync mobile tabs too.
                            if (mobile_tabs) {
                                mobile_tabs.querySelectorAll('.mobile-folder-tab').forEach(el => el.classList.remove('active'));
                                const match = [...mobile_tabs.querySelectorAll('.mobile-folder-tab')].find(el => el.dataset.folder === folderName);
                                if (match) match.classList.add('active');
                            }
                            // Clear any leftover search query when switching playlist.
                            const searchBox = document.getElementById('search-box');
                            if (searchBox) { searchBox.value = ''; filter_songs(); }
                            load_tracks();
                            close_sidebar();
                        };
                        container.appendChild(div);
                    }

                    // ── Mobile pill tab ───────────────────────────────────
                    if (mobile_tabs) {
                        const tab = document.createElement('div');
                        tab.className = 'mobile-folder-tab';
                        tab.dataset.folder = folderName;
                        if (folderName === current_folder) tab.classList.add('active');
                        tab.innerText = folderName;
                        tab.onclick = () => {
                            current_folder = folderName;
                            mobile_tabs.querySelectorAll('.mobile-folder-tab').forEach(el => el.classList.remove('active'));
                            tab.classList.add('active');
                            // Sync desktop sidebar too.
                            if (container) {
                                container.querySelectorAll('.folder-item').forEach(el => el.classList.remove('active'));
                                const match = [...container.querySelectorAll('.folder-item')].find(el => el.innerText === folderName);
                                if (match) match.classList.add('active');
                            }
                            const mobileSearch = document.getElementById('mobile-search-box');
                            if (mobileSearch) { mobileSearch.value = ''; filter_songs(); }
                            load_tracks();
                        };
                        mobile_tabs.appendChild(tab);
                    }
                });
            } catch (error) {
                if (container) container.innerHTML = '<div style="padding: 10px; color: #ff4d4d;">Failed to load folders.</div>';
                console.error("Folder Fetch Error:", error);
            }
        }

        // ── SHUFFLE / LOOP ────────────────────────────────────────────────

        function toggle_shuffle() {
            is_shuffle = !is_shuffle;
            const btn = document.getElementById('shuffle-btn');
            // White fill = active, transparent = inactive — same visual pattern as loop.
            if (is_shuffle) {
                btn.classList.remove('glass-tint-muted');
                btn.style.backgroundColor = 'white';
                btn.style.color = 'black'; 
            } else {
                btn.style.backgroundColor = '';
                btn.style.color = '';
                btn.classList.add('glass-tint-muted');
            }
        }

        function toggle_loop() {
            const btn = document.getElementById('loop-btn');
            audio.loop = !audio.loop;
            if (audio.loop) {
                btn.classList.remove('glass-tint-muted');
                btn.style.backgroundColor = 'white';
                btn.style.color = 'black';
            } else {
                btn.style.backgroundColor = '';
                btn.style.color = '';
                btn.classList.add('glass-tint-muted');
            }
        }

        // ── TRACKS ────────────────────────────────────────────────────────

        async function load_tracks() {
            document.getElementById('track-list').innerText = 'loading tracks...';
            document.getElementById('folder-title').innerText = current_folder;

            try {
                const res = await fetch(`/api/playlist?folder=${encodeURIComponent(current_folder)}`);
                if (!res.ok) {
                    const error_msg = await res.text();
                    console.error("Server Error:", error_msg);
                    document.getElementById('track-list').innerText = `Error ${res.status}: ${error_msg}`;
                    return;
                }

                const list = await res.json();
                current_playlist = list;
                const container = document.getElementById('track-list');
                container.innerHTML = '';

                list.forEach((raw_item, idx) => {
                    // Filenames are expected to follow "Artist - Title" convention.
                    // If there's no dash, leave artist blank — the bullet separator
                    // in CSS is :not(:empty) so it won't show for empty strings.
                    let artist = "";
                    let title = raw_item;
                    if (raw_item.includes('-')) {
                        const parts = raw_item.split('-');
                        artist = parts[0].trim();
                        title = parts.slice(1).join('-').trim();
                    }

                    const div = document.createElement('div');
                    div.className = 'track-item';
                    div.dataset.index = idx;
                    div.innerHTML = `<div class="track-title">${title}</div><div class="track-artist">${artist}</div>`;
                    div.onclick = () => play_song(raw_item, title, artist);

                    // The queue button prepends to play_next_queue, so the chosen track
                    // plays immediately after the current one, regardless of shuffle order.
                    const queue_btn = document.createElement('button');
                    queue_btn.className = 'queue-btn';
                    queue_btn.innerText = '⏭';
                    queue_btn.title = 'Play next';
                    queue_btn.onclick = (e) => {
                        e.stopPropagation();
                        play_next_queue.unshift(raw_item);
                        queue_btn.innerText = '✓';
                        setTimeout(() => queue_btn.innerText = '⏭', 1000);
                    };
                    div.appendChild(queue_btn);
                    container.appendChild(div);
                });
            } catch (error) {
                document.getElementById('track-list').innerText = 'Failed to load tracks. Check your connection.';
                console.error("Track Fetch Error:", error);
            }
        }

        // ── PLAYBACK ──────────────────────────────────────────────────────

        function play_song(raw_name, title, artist, skip_history = false) {
            const new_index = current_playlist.indexOf(raw_name);

            // Push the current song to history before changing current_track_index,
            // but only when navigating forward (not when play_prev itself calls us).
            if (!skip_history && current_track_index !== -1) {
                play_history.push(current_track_index);
                if (play_history.length > 100) play_history.shift(); // cap memory
            }

            has_preloaded_next = false;
            preloaded_index = -1;
            current_track_index = new_index;

            // Highlight the active track in the list.
            document.querySelectorAll('.track-item').forEach(el => el.classList.remove('playing'));
            const active_el = document.querySelector(`.track-item[data-index="${current_track_index}"]`);
            if (active_el) active_el.classList.add('playing');

            document.getElementById('np-title').innerText = title;
            document.getElementById('np-artist').innerText = artist;

            const progress_bar = document.getElementById('progress-bar');
            progress_bar.value = 0;

            const new_url = `/stream?filename=${encodeURIComponent(raw_name)}&user=${stream_user}&pass=${stream_pass}&folder=${encodeURIComponent(current_folder)}`;

            // ── Ghost player swap ──────────────────────────────────────────────────
            // Copying ghost_player.src to audio.src throws away the buffered bytes —
            // the browser still makes a fresh request. Instead, when the ghost has
            // already buffered the right track, we SWAP the two Audio objects so the
            // ghost (with its buffer intact) takes over as the main player, and the
            // old main player becomes the new ghost for the next preload.
            if (preloaded_index === new_index && ghost_player.readyState >= 2) {
                console.log("✅ Ghost swap! Instant playback from preloaded buffer.");

                // Detach all listeners from old audio element before swapping.
                const old_audio = audio;
                const new_audio = ghost_player;

                // Swap the module-level reference so all future event listeners
                // and function calls use the now-active element.
                audio = new_audio;
                ghost_player = old_audio;

                // The swapped-in element isn't in the DOM — we don't need it there
                // for playback, but we DO need the DOM element's id to stay consistent
                // for anything that does getElementById('audio-player'). Swap DOM too.
                const dom_audio = document.getElementById('audio-player');
                new_audio.id = 'audio-player';
                old_audio.id = 'audio-ghost';
                dom_audio.parentNode.replaceChild(new_audio, dom_audio);

                // Re-attach all event listeners to the new main audio element.
                attach_audio_listeners(audio);

                // Silence and reset the old player so it's ready to ghost next track.
                ghost_player.pause();
                ghost_player.src = '';
            } else {
                // Normal path — no usable preload, just set src directly.
                audio.src = new_url;
            }

            audio.play().then(() => {
                play_btn.innerText = "⏸";
                update_media_session(title, artist);
            }).catch(e => console.error("Playback failed:", e));
        }

        // Starts buffering the next track 30 s before the current one ends,
        // so there's no gap when the audio element fires 'ended'.
        function preload_next_track() {
            if (current_playlist.length < 2) return;
            let next_index;
            if (play_next_queue.length > 0) {
                // Peek at the queue without shifting — play_next will shift it.
                const queued_raw = play_next_queue[0];
                next_index = current_playlist.indexOf(queued_raw);
                if (next_index === -1) next_index = (current_track_index + 1) % current_playlist.length;
            } else if (is_shuffle) {
                next_index = current_track_index;
                while (next_index === current_track_index) {
                    next_index = Math.floor(Math.random() * current_playlist.length);
                }
            } else {
                next_index = (current_track_index + 1) % current_playlist.length;
            }
            const raw_name = current_playlist[next_index];
            const next_url = `/stream?filename=${encodeURIComponent(raw_name)}&user=${stream_user}&pass=${stream_pass}&folder=${encodeURIComponent(current_folder)}`;
            ghost_player.src = next_url;
            ghost_player.preload = 'auto';
            ghost_player.load();
            preloaded_index = next_index;
            console.log(`🔮 Preloading index ${next_index}: ${raw_name}`);
        }

        function filter_songs() {
            // Use whichever search box is currently visible:
            // mobile-search-box on ≤640px, sidebar search-box on desktop.
            const mobile_box  = document.getElementById('mobile-search-box');
            const desktop_box = document.getElementById('search-box');
            const is_mobile   = window.matchMedia('(max-width: 640px)').matches;
            const active_box  = is_mobile ? mobile_box : desktop_box;
            if (!active_box) return;
            const query = active_box.value.toLowerCase();
            // Show/hide existing DOM nodes — no re-render needed.
            document.querySelectorAll('.track-item').forEach(track => {
                track.style.display = track.innerText.toLowerCase().includes(query) ? 'flex' : 'none';
            });
        }

        // `let` not `const` — gets reassigned when ghost player swaps in as the main player.
        let audio = document.getElementById('audio-player');
        const play_btn = document.getElementById('play-btn');
        const progress = document.getElementById('progress-bar');
        const current_time_text = document.getElementById('current-time');
        const total_time_text   = document.getElementById('total-time');

        function play_next() {
            if (current_playlist.length === 0) return;
            // Manual "play next" queue takes priority over shuffle/sequential order.
            if (play_next_queue.length > 0) {
                const next_raw = play_next_queue.shift();
                const idx = current_playlist.indexOf(next_raw);
                if (idx !== -1) { load_track_from_index(idx); return; }
            }
            if (is_shuffle && current_playlist.length > 1) {
                let random_index = current_track_index;
                while (random_index === current_track_index) {
                    random_index = Math.floor(Math.random() * current_playlist.length);
                }
                current_track_index = random_index;
            } else {
                current_track_index = (current_track_index + 1) % current_playlist.length;
            }
            load_track_from_index(current_track_index);
        }

        function play_prev() {
            if (current_playlist.length === 0) return;
            // If we're more than 3 s into a song, restart it instead of going back.
            if (audio.currentTime > 3) {
                audio.currentTime = 0;
                return;
            }
            // Pop the real previous song from history (works in shuffle too).
            if (play_history.length > 0) {
                const prev_index = play_history.pop();
                load_track_from_index(prev_index, true); // true = skip_history push
                return;
            }
            // No history yet — just go one step back sequentially.
            current_track_index--;
            if (current_track_index < 0) current_track_index = current_playlist.length - 1;
            load_track_from_index(current_track_index, true);
        }

        // Re-parses the filename at a given index and calls play_song.
        // Used by next/prev navigation so they don't duplicate the artist/title split logic.
        // skip_history = true when called from play_prev so we don't re-push to history.
        function load_track_from_index(index, skip_history = false) {
            current_track_index = index;
            const raw_name = current_playlist[index];
            let artist = "";
            let title = raw_name;
            if (raw_name.includes('-')) {
                const parts = raw_name.split('-');
                artist = parts[0].trim();
                title = parts.slice(1).join('-').trim();
            }
            play_song(raw_name, title, artist, skip_history);
        }

        document.getElementById('next-btn').addEventListener('click', play_next);
        document.getElementById('prev-btn').addEventListener('click', play_prev);

        function toggle_play() {
            if (audio.paused) audio.play();
            else audio.pause();
        }

        function format_time(seconds) {
            const min = Math.floor(seconds / 60);
            const sec = Math.floor(seconds % 60);
            return `${min}:${sec < 10 ? '0' : ''}${sec}`;
        }

        // ── MEDIA SESSION API (iPhone lock screen / Control Centre) ───────
        function update_media_session(title, artist) {
            if (!('mediaSession' in navigator)) return;
            navigator.mediaSession.metadata = new MediaMetadata({
                title:  title  || 'Unknown Title',
                artist: artist || 'Unknown Artist',
                album:  current_folder || 'MusiCo',
                artwork: [
                    { src: 'https://raw.githubusercontent.com/aditya-3301/MusiCo/main/public/icon-192.png', sizes: '192x192', type: 'image/png' },
                    { src: 'https://raw.githubusercontent.com/aditya-3301/MusiCo/main/public/icon-512.png', sizes: '512x512', type: 'image/png' }
                ]
            });
            navigator.mediaSession.setActionHandler('play',          () => { audio.play();  play_btn.innerText = '⏸'; });
            navigator.mediaSession.setActionHandler('pause',         () => { audio.pause(); play_btn.innerText = '▶'; });
            navigator.mediaSession.setActionHandler('nexttrack',     play_next);
            navigator.mediaSession.setActionHandler('previoustrack', play_prev);
            navigator.mediaSession.setActionHandler('seekto', (details) => {
                if (details.seekTime !== undefined) audio.currentTime = details.seekTime;
            });
        }

        // ── AUDIO EVENT LISTENERS ─────────────────────────────────────────
        // Grouped in a function so they can be re-attached after a ghost-swap.
        let current_track_title = "";
        const buffer_bar   = document.getElementById('buffer-bar');

        function attach_audio_listeners(el) {
            el.addEventListener('play',  () => play_btn.innerText = '⏸');
            el.addEventListener('pause', () => play_btn.innerText = '▶');
            el.addEventListener('ended', play_next);

            el.addEventListener('error', () => {
                console.error("Playback error: File corrupted or MEGA stream failed.");
                document.getElementById('np-title').innerText = "⚠️ Stream error / Corrupted file. Skipping...";
                play_btn.innerText = '▶';
                setTimeout(play_next, 900);
            });

            // Show "Loading stream..." while buffering, restore title when playing.
            el.addEventListener('waiting', () => {
                current_track_title = document.getElementById('np-title').innerText;
                if (current_track_title !== "STREAM ERROR - Try again") {
                    document.getElementById('np-title').innerText = "Loading stream...";
                }
            });
            el.addEventListener('playing', () => {
                if (current_track_title && document.getElementById('np-title').innerText === "Loading stream...") {
                    document.getElementById('np-title').innerText = current_track_title;
                }
            });

            el.addEventListener('timeupdate', () => {
                if (el.duration) {
                    progress.value = (el.currentTime / el.duration) * 100;
                    current_time_text.innerText = format_time(el.currentTime);
                    total_time_text.innerText   = format_time(el.duration);
                }
                // Kick off preload when 30 s remain.
                const time_remaining = el.duration - el.currentTime;
                if (time_remaining <= 30 && !has_preloaded_next) {
                    has_preloaded_next = true;
                    preload_next_track();
                }
                // Lock-screen scrubber sync.
                if ('mediaSession' in navigator && el.duration) {
                    try {
                        navigator.mediaSession.setPositionState({
                            duration:     el.duration,
                            playbackRate: el.playbackRate,
                            position:     el.currentTime
                        });
                    } catch(e) {}
                }
            });

            // Buffer bar.
            el.addEventListener('progress', () => {
                if (el.duration > 0) {
                    for (let i = 0; i < el.buffered.length; i++) {
                        if (el.buffered.start(el.buffered.length - 1 - i) < el.currentTime) {
                            buffer_bar.style.width = (el.buffered.end(el.buffered.length - 1 - i) / el.duration) * 100 + "%";
                            break;
                        }
                    }
                }
            });
        }

        progress.addEventListener('input', () => {
            audio.currentTime = (progress.value / 100) * audio.duration;
        });

        // Attach listeners to the starting audio element.
        attach_audio_listeners(audio);

        // Boot sequence: load folder list and default playlist on page load.
        fetch_folders();
        load_tracks();
    </script>

    <script src="particles.js"></script>
    <script>
        particlesJS("particles-js", {
            "particles": {
                "number": { "value": 60 },
                "color": { "value": "#ffffff" },
                "shape": { "type": "circle" },
                "opacity": { "value": 0.4 },
                "size": { "value": 2.5 },
                "line_linked": { "enable": true, "distance": 130, "color": "#ffffff", "opacity": 0.25, "width": 1 },
                "move": { "enable": true, "speed": 1.2 }
            },
            "interactivity": {
                "detect_on": "canvas",
                "events": { "onhover": { "enable": true, "mode": "grab" } }
            }
        });

        gsap.registerPlugin(Draggable);

        // Draggable is only enabled on desktop. On touch devices the elastic snap
        // would fight with native scroll, so we skip registering it entirely.
        if (!('ontouchstart' in window)) {
            Draggable.create(".custom-controls", {
                type: "x, y",
                dragClickables: false,
                minimumMovement: 10,
                onRelease: function () {
                    gsap.to(this.target, { x: 0, y: 0, duration: 1.5, ease: "elastic.out(1,0.3)" });
                }
            });
            Draggable.create("#playlist-wrapper", {
                type: "x, y",
                dragClickables: false,
                minimumMovement: 10,
                onRelease: function () {
                    gsap.to(this.target, { x: 0, y: 0, duration: 0.9, ease: "elastic.out(1,0.3)" });
                }
            });
        }

        // App launches in shuffle mode by default — calling toggle_shuffle() once flips is_shuffle
        // to true and updates the button state without duplicating the activation logic.
        toggle_shuffle();
    </script>

    <!--
        Hidden SVG filter bank.
        These fractalNoise + feDisplacementMap combos create the subtle wavy glass-warp
        effect on the player bar, track cards, and playlist panel.
        Different scale values = different intensity per surface.
    -->
<svg style="display: none" xmlns="http://www.w3.org/2000/svg">
    <filter id="glass-blur-player" x="0" y="0" width="100%" height="100%" filterUnits="objectBoundingBox">
        <feTurbulence type="fractalNoise" baseFrequency="0.003 0.007" numOctaves="1" result="turbulence" />
        <feDisplacementMap in="SourceGraphic" in2="turbulence" scale="200" xChannelSelector="R" yChannelSelector="G" />
    </filter>
    <filter id="glass-blur-track" x="0" y="0" width="100%" height="100%" filterUnits="objectBoundingBox">
        <feTurbulence type="fractalNoise" baseFrequency="0.003 0.007" numOctaves="1" result="turbulence" />
        <feDisplacementMap in="SourceGraphic" in2="turbulence" scale="130" xChannelSelector="R" yChannelSelector="G" />
    </filter>
    <filter id="glass-blur-playlist" x="0" y="0" width="100%" height="100%" filterUnits="objectBoundingBox">
        <feTurbulence type="fractalNoise" baseFrequency="0.003 0.007" numOctaves="1" result="turbulence" />
        <feDisplacementMap in="SourceGraphic" in2="turbulence" scale="150" xChannelSelector="R" yChannelSelector="G" />
    </filter>
</svg>

</body>
